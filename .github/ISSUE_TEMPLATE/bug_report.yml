name: 🐛 Bug Report
description: File a bug report to help improve Project SREE
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with SREE! Please provide as much context as possible to help reproduce and fix it quickly.
  - type: input
    id: version
    attributes:
      label: SREE Version / Commit Hash
      description: What version or git commit of SREE are you running?
      placeholder: e.g. main branch, commit 83b1645
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of SREE does this bug affect?
      options:
        - "Backend (FastAPI / Router / Main)"
        - "Database / SQLite / Migrations"
        - "AI Engine / Ollama / Cloud Routing"
        - "Desktop Automation (PyAutoGUI / Screen Share)"
        - "Audio / Voice Listener / Wake-Word"
        - "Frontend HUD / PWA / Web UI"
        - "Windows Service / Packaging / Bat Scripts"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Start SREE with '...'
        2. Execute '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Terminal Output
      description: Paste any error messages or tracebacks here.
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Linux / WSL
        - macOS (Non-native)
    validations:
      required: true
