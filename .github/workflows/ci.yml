name: SREE CI Test Suite

on:
  push:
    branches: [ "main", "contribution/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit & Automation Tests
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Master Unit Test Suite (90 Unit Tests)
      run: |
        python tests/test_unit_suite.py

    - name: Run Desktop Screen & Automation Suite (19 Tests)
      run: |
        python tests/test_desktop_screen_suite.py
